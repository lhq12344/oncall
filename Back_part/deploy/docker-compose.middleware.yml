services:
  redis:
    image: redis:7-alpine
    ports:
      - "${MIDDLEWARE_BIND_HOST:-127.0.0.1}:31029:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    ports:
      - "${MIDDLEWARE_BIND_HOST:-127.0.0.1}:2379:2379"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-03-13T19-46-17Z
    environment:
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
    volumes:
      - minio_data:/minio_data
    ports:
      - "${MIDDLEWARE_BIND_HOST:-127.0.0.1}:9000:9000"
      - "${MIDDLEWARE_BIND_HOST:-127.0.0.1}:9001:9001"
    command: minio server /minio_data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.4.23
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "${MIDDLEWARE_BIND_HOST:-127.0.0.1}:31953:19530"
    depends_on:
      - etcd
      - minio
    restart: unless-stopped

  attu:
    image: zilliz/attu:v2.4.12
    ports:
      - "${MIDDLEWARE_BIND_HOST:-127.0.0.1}:${ATTU_PORT:-8000}:3000"
    environment:
      MILVUS_URL: milvus:19530
    depends_on:
      - milvus
    restart: unless-stopped

volumes:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
