# https://goframe.org/docs/web/server-config-file-template
server:
  address: ":6872"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

# https://goframe.org/docs/core/glog-config
logger:
  level: "all"
  stdout: true

file_dir: "./docs/"

# Chat model configuration.
# Secrets should be provided through .env or the shell:
# DS_QUICK_CHAT_MODEL_API_KEY, DS_QUICK_CHAT_MODEL_BASE_URL, DS_QUICK_CHAT_MODEL_MODEL
ds_quick_chat_model:
  api_key: ""
  base_url: ""
  model: ""

# Embedding model configuration.
# Secrets should be provided through .env or the shell:
# DOUBAO_EMBEDDING_MODEL_API_KEY, DOUBAO_EMBEDDING_MODEL_BASE_URL, DOUBAO_EMBEDDING_MODEL_MODEL
doubao_embedding_model:
  api_key: ""
  base_url: ""
  model: ""
  api_type: "auto"
  dimensions: 2048

redis:
  addr: "localhost:31029"
  db: 0
  dialTimeout: 2

web_search:
  provider: "auto"
  serper_api_key: ""
  serper_base_url: "https://google.serper.dev/search"
  searxng_base_url: ""

# Milvus vector database; matches deploy/docker-compose.middleware.yml.
milvus:
  address: "127.0.0.1:31953"
  database: "default"
  collection: "oncall_knowledge"
  timeout: "8s"
