name: Phase 13 Verification

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

jobs:
  phase13:
    name: Local gates plus race
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Phase 13 verification
        shell: pwsh
        run: ./backend/hack/phase13-verify.ps1 -RequireRace -EvidencePath phase13-local-evidence.json

      - name: Upload Phase 13 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase13-local-evidence
          path: phase13-local-evidence.json
          if-no-files-found: warn
